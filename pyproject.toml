[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading-bots"
dynamic = ["version"]
description = "Sistema multiagente de trading cripto em reais, paper-first (v0.1)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "vinicius20lima" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.dynamic]
version = { attr = "atlas.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." keeps `import tests` working when CI runs the pytest script.
# `python -m pytest` puts the cwd on sys.path; the console script does not.
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
